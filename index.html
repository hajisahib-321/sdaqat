<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="صداقت">
<link rel="manifest" href="manifest.json">
<title>مدیریت کرایه صداقت</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#15171a;--muted:#737983;--line:#e5e7eb;--dark:#111827;--green:#14804a;--red:#c53030;--amber:#a56a12;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{border:0}.app{max-width:780px;margin:auto;padding-bottom:95px}header{background:var(--dark);color:#fff;padding:calc(17px + env(safe-area-inset-top)) 16px 15px;position:sticky;top:0;z-index:20}.head{display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;color:#c9ced8;margin-top:3px}
.container{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:0 3px 14px #00000007}.hero{background:var(--dark);color:#fff}.label{font-size:12px;color:var(--muted)}.hero .label{color:#cbd1da}.big{font-size:28px;font-weight:850;margin-top:6px}.money{font-variant-numeric:tabular-nums}.mini{background:#f7f8fa;border-radius:13px;padding:11px}.hero .mini{background:#ffffff12}.mini b{display:block;margin-top:4px}.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.section{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 10px}.section h2{font-size:16px;margin:0}.btn{background:var(--dark);color:#fff;padding:11px 14px;border-radius:12px;font-weight:750}.btn.green{background:var(--green)}.btn.light{background:#eceef1;color:#20242a}.btn.red{background:#fde9e9;color:var(--red)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:780px;margin:auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.nav button{background:transparent;color:#777;font-size:10px;padding:3px}.nav button.active{color:var(--dark);font-weight:800}.nav span{display:block;font-size:19px}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.title{font-weight:750}.muted{font-size:11px;color:var(--muted);margin-top:3px}.amount{font-weight:800}.badge{display:inline-block;font-size:10px;border-radius:20px;padding:4px 7px;background:#eef0f3}.badge.green{background:#e5f6ec;color:var(--green)}.badge.red{background:#fde9e9;color:var(--red)}.badge.amber{background:#fff2d5;color:var(--amber)}
.toolbar{display:flex;gap:8px;margin-bottom:11px}.input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.input:focus,textarea:focus,select:focus{border-color:#9299a4}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:760px;max-height:94vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:17px 15px calc(25px + env(safe-area-inset-bottom));margin:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheethead h3{margin:0}.close{width:34px;height:34px;border-radius:50%;background:#e7e9ed;font-size:20px}.empty{text-align:center;color:var(--muted);padding:28px 8px}.receipt{background:#fff;padding:18px;border-radius:15px;max-width:430px;margin:auto}.receipt h2{text-align:center;margin:0}.center{text-align:center;color:#666;font-size:11px}.receiptline{display:flex;justify-content:space-between;padding:7px 0}.receipt hr{border:0;border-top:1px dashed #999;margin:12px 0}.total{font-size:18px;font-weight:850}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tab{white-space:nowrap;background:#e9ebee;color:#555;border-radius:20px;padding:8px 12px}.tab.active{background:var(--dark);color:#fff}
.toast{display:none;position:fixed;z-index:100;top:80px;left:50%;transform:translateX(-50%);background:#15171a;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px}
@media(min-width:700px){.modal{align-items:center}.sheet{width:700px;border-radius:24px}.nav{left:50%;right:auto;transform:translateX(-50%);width:100%}}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><div><div class="brand">مدیریت کرایه صداقت</div><div class="sub">کرایه • برق • باقی‌داری • رسید</div></div><button class="btn light" onclick="go('settings')">⚙️</button></div></header>
<main id="main" class="container"></main>
<nav class="nav">
<button data-page="home" onclick="go('home')"><span>⌂</span>خانه</button>
<button data-page="houses" onclick="go('houses')"><span>🏠</span>حویلی‌ها</button>
<button data-page="shops" onclick="go('shops')"><span>🏪</span>دوکان‌ها</button>
<button data-page="debts" onclick="go('debts')"><span>💰</span>باقی‌داری</button>
<button data-page="settings" onclick="go('settings')"><span>⚙️</span>تنظیمات</button>
</nav>
</div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='sadaqat_rent_full_v2';
const PM=['حمل','ثور','جوزا','سرطان','اسد','سنبله','میزان','عقرب','قوس','جدی','دلو','حوت'];
const JM=[31,31,31,31,31,31,30,30,30,30,30,29];
function isLeap(y){return [1,5,9,13,17,22,26,30].includes((y-1403)%33)}
function g2j(gy,gm,gd){let gdays=[0,31,28,31,30,31,30,31,31,30,31,30,31],d=gd;for(let i=1;i<gm;i++)d+=gdays[i];if(gm>2&&((gy%4===0&&gy%100!==0)||gy%400===0))d++;let jy=gy-621,base=79,jd=d-base;if(jd<=0){jy--;jd+=365+(isLeap(jy)?1:0)}let jm,j;if(jd<=186){jm=Math.ceil(jd/31);j=((jd-1)%31)+1}else{let q=jd-186;jm=Math.ceil(q/30)+6;j=((q-1)%30)+1}return[jy,jm,j]}
function today(){let d=new Date(),x=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return `${x[0]}-${String(x[1]).padStart(2,'0')}-${String(x[2]).padStart(2,'0')}`}
function ym(){return today().slice(0,7)}
function ml(m){let a=m.split('-');return `${PM[Number(a[1])-1]} ${a[0]}`}
function monthsAround(){let y=Number(ym().slice(0,4)),m=Number(ym().slice(5));let a=[];for(let k=-12;k<=12;k++){let n=y*12+m-1+k,yy=Math.floor(n/12),mm=n%12+1;if(mm<1){mm+=12;yy--}a.push(`${yy}-${String(mm).padStart(2,'0')}`)}return a}
function monthOptions(sel){return monthsAround().map(v=>`<option value="${v}" ${v===sel?'selected':''}>${ml(v)}</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const money=n=>Number(n||0).toLocaleString('fa-AF');
let db=JSON.parse(localStorage.getItem(KEY)||'null');
if(!db){db={properties:[],payments:[],electric:[],nextId:1};for(let i=1;i<=15;i++)db.properties.push({id:'H'+i,type:'house',number:i,name:'',phone:'',rent:0,deposit:0,dueDay:1,note:''});for(let i=1;i<=20;i++)db.properties.push({id:'S'+i,type:'shop',number:i,name:'',phone:'',rent:0,deposit:0,dueDay:1,note:''});save()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function prop(id){return db.properties.find(p=>p.id===id)}
function paid(id,m){return db.payments.filter(x=>x.propertyId===id&&x.month===m).reduce((a,x)=>a+Number(x.amount||0),0)}
function elec(id,m){return db.electric.find(x=>x.propertyId===id&&x.month===m)}
function bill(p,m){let e=elec(p.id,m),ec=e?Math.max(0,Number(e.newReading)-Number(e.oldReading))*Number(e.unitPrice||0):0;return {rent:Number(p.rent||0),electric:ec,paid:paid(p.id,m)}}
function balance(id,m){let p=prop(id), b=bill(p,m), prev=prevBalance(id,m);return Math.max(0,prev+b.rent+b.electric-b.paid)}
function prevBalance(id,m){let prev=previousMonth(m), seen=new Set(),cur=prev,total=0,guard=0;while(cur&&guard<240){let b=bill(prop(id),cur);let value=Math.max(0,total+b.rent+b.electric-b.paid);total=value;let ps=db.payments.filter(x=>x.propertyId===id&&x.month===cur).length, es=db.electric.filter(x=>x.propertyId===id&&x.month===cur).length;if((b.rent===0&&b.electric===0&&ps===0&&es===0)&&guard>0)break;cur=previousMonth(cur);guard++}return total}
function previousMonth(m){let [y,mo]=m.split('-').map(Number);mo--;if(mo<1){mo=12;y--}return `${y}-${String(mo).padStart(2,'0')}`}
function summary(m){let s={rent:0,electric:0,paid:0,balance:0,old:0};db.properties.forEach(p=>{let b=bill(p,m);s.rent+=b.rent;s.electric+=b.electric;s.paid+=b.paid;s.old+=prevBalance(p.id,m);s.balance+=balance(p.id,m)});return s}
let page='home', currentFilter='all';
function go(x){page=x;render()}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({home,debts,settings}[page]?.()||((page==='houses'||page==='shops')&&listing(page==='houses'?'house':'shop')))}
function home(){let m=ym(),s=summary(m),due=db.properties.filter(p=>balance(p.id,m)>0).length;document.getElementById('main').innerHTML=`
<div class="card hero"><div class="label">باقی‌داری این ماه — ${ml(m)}</div><div class="big">${money(s.balance)} افغانی</div><div class="stat2"><div class="mini"><span>باقی از قبل</span><b>${money(s.old)}</b></div><div class="mini"><span>دریافت‌شده</span><b>${money(s.paid)}</b></div></div></div>
<div class="grid" style="margin-top:10px"><div class="card"><div class="label">مجموع کرایه</div><div class="big">${money(s.rent)}</div></div><div class="card"><div class="label">مجموع برق</div><div class="big">${money(s.electric)}</div></div></div>
<div class="section"><h2>${due} مورد دارای باقی</h2><button class="btn green" onclick="openPayment()">+ ثبت پرداخت</button></div>
<div class="list">${db.properties.filter(p=>balance(p.id,m)>0).slice(0,12).map(p=>item(p,m)).join('')||'<div class="empty">باقی‌داری وجود ندارد.</div>'}</div>
<div class="section"><h2>دسترسی سریع</h2></div><div class="grid"><button class="card" onclick="go('houses')">🏠 حویلی‌ها<br><span class="muted">۱۵ حویلی</span></button><button class="card" onclick="go('shops')">🏪 دوکان‌ها<br><span class="muted">۲۰ دوکان</span></button></div>`}
function item(p,m){let b=bill(p,m),bal=balance(p.id,m),old=prevBalance(p.id,m);return `<div class="row" onclick="details('${p.id}')"><div><div class="title">${p.type==='house'?'حویلی':'دوکان'} ${p.number} ${p.name?'— '+esc(p.name):''}</div><div class="muted">کرایه ${money(b.rent)} • برق ${money(b.electric)} • قبلی ${money(old)}</div></div><div style="text-align:left"><div class="amount">${money(bal)}</div><span class="badge ${bal?'red':'green'}">${bal?'باقی':'تسویه'}</span></div></div>`}
function listing(type){let a=db.properties.filter(p=>p.type===type);document.getElementById('main').innerHTML=`<div class="section"><h2>${type==='house'?'حویلی‌ها':'دوکان‌ها'} (${a.length})</h2><button class="btn" onclick="propertyForm(null,'${type}')">+ افزودن</button></div><div class="toolbar"><input id="q" class="input" placeholder="نام، شماره یا تماس..." oninput="filter('${type}')"></div><div id="plist" class="list">${a.map(p=>item(p,ym())).join('')}</div>`}
function filter(type){let q=document.getElementById('q').value.toLowerCase(),a=db.properties.filter(p=>p.type===type&&(`${p.number} ${p.name} ${p.phone}`).toLowerCase().includes(q));document.getElementById('plist').innerHTML=a.map(p=>item(p,ym())).join('')||'<div class="empty">موردی پیدا نشد.</div>'}
function debts(){let m=ym(),a=db.properties.filter(p=>balance(p.id,m)>0),s=summary(m);document.getElementById('main').innerHTML=`<div class="card hero"><div class="label">کل باقی‌داری — ${ml(m)}</div><div class="big">${money(s.balance)} افغانی</div></div><div class="section"><h2>بدهکاران (${a.length})</h2><button class="btn" onclick="openPayment()">+ پرداخت</button></div><div class="list">${a.map(p=>item(p,m)).join('')||'<div class="empty">هیچ باقی‌داری نیست.</div>'}</div>`}
function settings(){document.getElementById('main').innerHTML=`<div class="section"><h2>تنظیمات</h2></div><div class="list">
<div class="row" onclick="backup()"><div><b>💾 پشتیبان‌گیری</b><div class="muted">تمام اطلاعات در یک فایل</div></div><span>›</span></div>
<div class="row" onclick="document.getElementById('restore').click()"><div><b>📥 بازیابی بکاپ</b><div class="muted">برگرداندن اطلاعات قبلی</div></div><span>›</span></div>
<div class="row" onclick="report()"><div><b>📊 گزارش ماهانه</b><div class="muted">کرایه، برق، دریافت و باقی</div></div><span>›</span></div>
<div class="row" onclick="propertyForm(null,'house')"><div><b>🏠 افزودن حویلی</b></div><span>›</span></div>
<div class="row" onclick="propertyForm(null,'shop')"><div><b>🏪 افزودن دوکان</b></div><span>›</span></div>
<div class="row" onclick="if(confirm('همه اطلاعات حذف شود؟ این کار قابل برگشت نیست.')){localStorage.removeItem(KEY);location.reload()}"><div><b style="color:var(--red)">حذف همه اطلاعات</b></div><span>›</span></div></div>
<input id="restore" type="file" accept=".json" hidden onchange="restore(this)">`}
function details(id){let p=prop(id),m=ym(),b=bill(p,m),bal=balance(id,m),old=prevBalance(id,m),e=elec(id,m);document.getElementById('sheet').innerHTML=`<div class="sheethead"><h3>${p.type==='house'?'حویلی':'دوکان'} ${p.number}</h3><button class="close" onclick="closeM()">×</button></div>
<div class="card"><b>${esc(p.name)||'بدون نام'}</b><div class="muted">${esc(p.phone)||'شماره تماس ثبت نشده'}</div><div class="stat2"><div class="mini">باقی قبلی<b>${money(old)}</b></div><div class="mini">باقی فعلی<b>${money(bal)}</b></div></div></div>
<div class="section"><h2>حساب ${ml(m)}</h2><button class="btn light" onclick="electricForm('${id}')">⚡ برق</button></div>
<div class="list"><div class="row"><span>کرایه</span><b>${money(b.rent)}</b></div><div class="row"><span>برق</span><b>${money(b.electric)}</b></div><div class="row"><span>پرداخت این ماه</span><b>${money(b.paid)}</b></div><div class="row"><span>باقی از قبل</span><b>${money(old)}</b></div><div class="row"><span>مجموع باقی</span><b class="amount">${money(bal)} افغانی</b></div></div>
<div class="actions"><button class="btn green" onclick="openPayment('${id}')">+ ثبت پرداخت</button><button class="btn light" onclick="propertyForm('${id}')">ویرایش</button><button class="btn red" onclick="delProp('${id}')">حذف</button></div>
<div class="section"><h2>تاریخچه ماه‌ها</h2></div><div class="list">${history(id).map(x=>`<div class="row"><div><b>${ml(x)}</b><div class="muted">کرایه ${money(bill(p,x).rent)} • برق ${money(bill(p,x).electric)} • پرداخت ${money(bill(p,x).paid)}</div></div><b>${money(balance(id,x))}</b></div>`).join('')}</div>`;showM()}
function history(id){let s=new Set([ym()]);db.payments.filter(x=>x.propertyId===id).forEach(x=>s.add(x.month));db.electric.filter(x=>x.propertyId===id).forEach(x=>s.add(x.month));return [...s].sort().reverse().slice(0,24)}
function propertyForm(id,type){let p=id?prop(id):{id:'',type:type||'house',number:'',name:'',phone:'',rent:0,deposit:0,dueDay:1,note:''};document.getElementById('sheet').innerHTML=`<div class="sheethead"><h3>${id?'ویرایش':'افزودن'} ${p.type==='house'?'حویلی':'دوکان'}</h3><button class="close" onclick="closeM()">×</button></div><div class="formgrid">
<div class="field"><label>شماره</label><input id="fn" class="input" type="number" value="${p.number}"></div><div class="field"><label>نام مستأجر</label><input id="fna" class="input" value="${esc(p.name)}"></div>
<div class="field"><label>شماره تماس</label><input id="fp" class="input" value="${esc(p.phone)}" inputmode="tel"></div><div class="field"><label>کرایه ماهانه</label><input id="fr" class="input" type="number" value="${p.rent}"></div>
<div class="field"><label>تضمین / پیش‌پرداخت</label><input id="fd" class="input" type="number" value="${p.deposit}"></div><div class="field"><label>روز پرداخت</label><input id="fday" class="input" type="number" min="1" max="31" value="${p.dueDay}"></div>
<div class="field full"><label>یادداشت</label><textarea id="fno">${esc(p.note)}</textarea></div></div><div class="actions"><button class="btn green" onclick="saveProp('${id||''}','${p.type}')">ذخیره</button><button class="btn light" onclick="closeM()">لغو</button></div>`;showM()}
function saveProp(id,type){let p=id?prop(id):{id:(type==='house'?'H':'S')+Date.now(),type};Object.assign(p,{number:Number(fn.value||0),name:fna.value,phone:fp.value,rent:Number(fr.value||0),deposit:Number(fd.value||0),dueDay:Number(fday.value||1),note:fno.value});if(!id)db.properties.push(p);save();closeM();render();toast('ذخیره شد')}
function delProp(id){if(confirm('این مورد و حساب‌های مرتبط حذف شود؟')){db.properties=db.properties.filter(x=>x.id!==id);db.payments=db.payments.filter(x=>x.propertyId!==id);db.electric=db.electric.filter(x=>x.propertyId!==id);save();closeM();render();toast('حذف شد')}}
function openPayment(id){let selected=id||db.properties[0]?.id;document.getElementById('sheet').innerHTML=`<div class="sheethead"><h3>ثبت پرداخت</h3><button class="close" onclick="closeM()">×</button></div>
<div class="field"><label>مستأجر / محل</label><select id="pp">${db.properties.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${p.type==='house'?'حویلی':'دوکان'} ${p.number} — ${esc(p.name)||'بدون نام'}</option>`).join('')}</select></div>
<div class="formgrid"><div class="field"><label>ماه شمسی</label><select id="pm">${monthOptions(ym())}</select></div><div class="field"><label>تاریخ پرداخت شمسی</label><input id="pd" class="input" value="${today()}" placeholder="1405-07-13"></div><div class="field"><label>مبلغ پرداختی</label><input id="pa" class="input" type="number" inputmode="decimal"></div><div class="field"><label>یادداشت</label><input id="pn" class="input" placeholder="مثلاً کرایه و برق"></div></div>
<div class="card" id="payPreview">باقی فعلی: —</div><div class="actions"><button class="btn green" onclick="savePay()">ثبت پرداخت و رسید</button></div>`;showM();pp.onchange=previewPay;pm.onchange=previewPay;pa.oninput=previewPay;previewPay()}
function previewPay(){let p=prop(pp.value),m=pm.value,b=bill(p,m),old=prevBalance(p.id,m),before=old+b.rent+b.electric-b.paid,after=Math.max(0,before-Number(pa.value||0));document.getElementById('payPreview').innerHTML=`بدهی قبل از این پرداخت: <b>${money(Math.max(0,before))}</b> افغانی<br>باقی بعد از پرداخت: <b>${money(after)}</b> افغانی`}
function savePay(){let amount=Number(pa.value||0);if(amount<=0)return toast('مبلغ را وارد کنید');let x={id:db.nextId++,propertyId:pp.value,month:pm.value,date:pd.value||today(),amount,note:pn.value};db.payments.push(x);save();receipt(x);render()}
function receipt(x){let p=prop(x.propertyId),m=x.month,b=bill(p,m),old=prevBalance(p.id,m),before=Math.max(0,old+b.rent+b.electric-(b.paid-x.amount)),after=balance(p.id,m);document.getElementById('sheet').innerHTML=`<div class="sheethead"><h3>رسید پرداخت</h3><button class="close" onclick="closeM()">×</button></div><div class="receipt" id="rc"><h2>مدیریت کرایه صداقت</h2><div class="center">رسید پرداخت</div><hr><div class="receiptline"><span>مستأجر</span><b>${esc(p.name)||'بدون نام'}</b></div><div class="receiptline"><span>محل</span><b>${p.type==='house'?'حویلی':'دوکان'} ${p.number}</b></div><div class="receiptline"><span>ماه</span><b>${ml(m)}</b></div><div class="receiptline"><span>کرایه</span><b>${money(b.rent)}</b></div><div class="receiptline"><span>برق</span><b>${money(b.electric)}</b></div><div class="receiptline"><span>باقی قبلی</span><b>${money(old)}</b></div><div class="receiptline"><span>پرداخت</span><b>${money(x.amount)}</b></div><hr><div class="receiptline total"><span>باقی جدید</span><b>${money(after)}</b></div><div class="center">رسید شماره ${x.id} • ${esc(x.date)}</div></div><div class="actions"><button class="btn" onclick="printReceipt()">🖨️ چاپ / PDF</button><button class="btn light" onclick="closeM()">بستن</button></div>`;showM()}
function electricForm(id){let p=prop(id),m=ym(),e=elec(id,m);if(!e){let pm=previousMonth(m),pe=elec(id,pm);e={oldReading:pe?pe.newReading:0,newReading:pe?pe.newReading:0,unitPrice:0}}document.getElementById('sheet').innerHTML=`<div class="sheethead"><h3>برق ${p.type==='house'?'حویلی':'دوکان'} ${p.number}</h3><button class="close" onclick="closeM()">×</button></div><div class="formgrid">
<div class="field"><label>ماه شمسی</label><select id="em">${monthOptions(m)}</select></div><div class="field"><label>قیمت هر واحد</label><input id="ep" class="input" type="number" value="${e.unitPrice}"></div>
<div class="field"><label>قرائت قبلی</label><input id="eo" class="input" type="number" value="${e.oldReading}"></div><div class="field"><label>قرائت جدید</label><input id="en" class="input" type="number" value="${e.newReading}"></div></div>
<div class="card">مصرف: <b id="eu">0</b> واحد — مبلغ: <b id="ec">0</b> افغانی</div><div class="actions"><button class="btn green" onclick="saveElec('${id}')">ذخیره برق</button></div>`;showM();[eo,en,ep].forEach(x=>x.oninput=calcElec);calcElec()}
function calcElec(){let u=Math.max(0,Number(en.value||0)-Number(eo.value||0)),c=u*Number(ep.value||0);eu.textContent=money(u);ec.textContent=money(c)}
function saveElec(id){let m=em.value,old=Number(eo.value||0),nw=Number(en.value||0),price=Number(ep.value||0);db.electric=db.electric.filter(x=>!(x.propertyId===id&&x.month===m));db.electric.push({id:Date.now(),propertyId:id,month:m,oldReading:old,newReading:nw,unitPrice:price});save();closeM();details(id);toast('برق ذخیره شد')}
function report(){let m=prompt('ماه شمسی را به شکل 1405-07 وارد کنید:',ym());if(!m)return;let s=summary(m);document.getElementById('sheet').innerHTML=`<div class="sheethead"><h3>گزارش ${ml(m)}</h3><button class="close" onclick="closeM()">×</button></div><div class="grid"><div class="card">کرایه<div class="big">${money(s.rent)}</div></div><div class="card">برق<div class="big">${money(s.electric)}</div></div><div class="card">دریافت<div class="big">${money(s.paid)}</div></div><div class="card">باقی<div class="big">${money(s.balance)}</div></div></div><div class="section"><h2>جزئیات</h2></div><div class="list">${db.properties.map(p=>`<div class="row"><span>${p.type==='house'?'حویلی':'دوکان'} ${p.number} — ${esc(p.name)||'بدون نام'}</span><b>${money(balance(p.id,m))}</b></div>`).join('')}</div>`;showM()}
function printReceipt(){let c=document.getElementById('rc').outerHTML,w=window.open('','_blank');if(!w)return alert('لطفاً اجازه بازشدن صفحه چاپ را بدهید.');w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>رسید صداقت</title><style>body{font-family:Arial;padding:18px}.receipt{max-width:420px;margin:auto}.receiptline{display:flex;justify-content:space-between;padding:7px 0}.center{text-align:center;color:#666;font-size:11px}hr{border:0;border-top:1px dashed #888}.total{font-size:18px;font-weight:bold}</style></head><body>${c}</body></html>`);w.document.close();w.print()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Sadaqat_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('بکاپ آماده شد')}
function restore(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.properties||!x.payments||!x.electric)throw 0;if(confirm('اطلاعات فعلی با بکاپ جایگزین شود؟')){db=x;save();render();toast('بکاپ بازیابی شد')}}catch(e){alert('فایل بکاپ معتبر نیست.')}};r.readAsText(f)}
function showM(){modal.classList.add('show')}function closeM(){modal.classList.remove('show')}modal.addEventListener('click',e=>{if(e.target===modal)closeM()})
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
